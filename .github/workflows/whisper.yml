# Builds libsquishwhisper.so (tools/native/build_whisper.sh) for the four
# Android ABIs: whisper.cpp behind a small JNI surface, for captions on phones
# with no on-device recognizer (docs/EDGE_PLAN.md E1). The libraries are
# committed under app/src/main/jniLibs from the artifacts
# (tools/native/fetch_whisper.sh), so a Gradle build never needs this.
name: whisper

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/native/whisper/**'
      - 'tools/native/build_whisper.sh'
      - '.github/workflows/whisper.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - name: Build
        run: bash tools/native/build_whisper.sh ${{ matrix.abi }} "$PWD/whisper-work"
      - uses: actions/upload-artifact@v4
        with:
          name: squishwhisper-${{ matrix.abi }}
          path: whisper-work/out/${{ matrix.abi }}/
          if-no-files-found: error
