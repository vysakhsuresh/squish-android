// Classes the Compose compiler is told to treat as stable (compared with equals,
// not identity). Kotlin 2.0's strong skipping compares anything it calls
// unstable by identity, so a new-but-equal object every pass - toTimeline()'s
// Clip for every caption line, a list rebuilt from the same state - re-ran its
// composable every time: fifty-seven caption clips on the strip, several times a
// second while playing. Everything here is immutable as this app uses it: the
// read-only collection interfaces (nothing in the app mutates a list it has
// handed on; a MutableList/MutableMap parameter is a different type and stays
// unstable), and android.net.Uri, which is immutable by design.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
android.net.Uri
// A data class whose equality is its points; the var inside is a private memo
// of a computed duration and the lazies are derived from the points.
com.squish.app.timeline.SpeedRamp
// A mask and its keys refer to each other, which the compiler cannot settle and
// so calls unstable; both are immutable data classes.
com.squish.app.timeline.Mask
com.squish.app.timeline.MaskKey
// Its peaks are written while the array is built and never after; a plain
// class, so it is still compared by identity - this only stops it making every
// TimelineState unstable.
com.squish.app.media.audio.Waveform
